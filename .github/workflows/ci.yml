name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  week-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week-1/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  week-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week-2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
